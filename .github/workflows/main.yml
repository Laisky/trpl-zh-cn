name: Book checks and publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  examples:
    name: Fast Rust 1.58 behavior units
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Source and script hygiene
        run: |
          git diff --check HEAD^ HEAD
          bash -n .github/ci/render-book.sh
          python3 -m py_compile tests/test_guessing_examples.py
      - name: Install supported compiler
        run: |
          rustup toolchain install 1.58.0 --profile minimal
          rustup override set 1.58.0
      - name: Fetch locked example dependencies
        run: |
          for name in listing-02-02 listing-02-03 listing-02-04 listing-02-05 listing-02-06 no-listing-03-convert-string-to-number no-listing-04-looping no-listing-05-quitting; do
            cargo fetch --locked --manifest-path "listings/ch02-guessing-game-tutorial/$name/Cargo.toml"
          done
      - name: Fast teaching behavior regressions
        env:
          CARGO: cargo
          TEST_BUILD_DIR: ${{ runner.temp }}/book-example-targets
        run: timeout 240 python3 -m unittest discover -s tests -v

  publish:
    name: Render and publish approved main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: examples
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Render with qualified pinned runtime
        run: bash .github/ci/render-book.sh "$PWD/book"
      - name: Assemble public HTML and PDF only
        run: |
          mkdir -p book-publish
          cp -a book/html/. book-publish/
          find book/latex-pdf -maxdepth 1 -name '*.pdf' -exec cp '{}' book-publish/ ';'
      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book-publish
          force_orphan: true
          enable_jekyll: true
